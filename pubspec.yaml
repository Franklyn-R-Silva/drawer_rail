name: drawer_rail
description: >-
  A collapsible, themeable side navigation drawer with a full-width panel and a
  narrow icon rail: search, sections, badges, expandable groups and flyouts.
version: 0.8.1
homepage: https://devfrs.com
repository: https://github.com/Franklyn-R-Silva/drawer_rail
issue_tracker: https://github.com/Franklyn-R-Silva/drawer_rail/issues
topics:
  - drawer
  - navigation
  - sidebar
  - ui
  - widget

# pub.dev shows these on the listing and uses the first as the search thumbnail.
# Only the still ships: the GIF would add 3 MB to every `pub get`, and the
# README already plays it on the same page.
screenshots:
  - description: 'The drawer_rail panel expanded on a wide screen: search field, section labels, the selected item, text and count badges, a group and a footer.'
    path: screenshots/drawer_rail.png

environment:
  # Flutter 3.32 is the oldest release the whole test suite passes on (CI's
  # min Flutter job checks it). The Dart bound stays lower on purpose: it sets
  # the language version, and moving it past 3.6 changes `dart format` output.
  sdk: ^3.6.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
