version: 2

updates:
  # The workflows pin every action to a commit SHA, and a SHA ages silently;
  # nothing in a green build tells you it has been superseded. Dependabot
  # bumps the SHA and its `# vX.Y.Z` comment together, one grouped PR a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A hijacked release is usually caught and pulled within days; waiting a
    # week keeps it out of the PR. Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # The package has no runtime dependencies beyond Flutter; this keeps the dev
  # ones (flutter_lints) current in the package and in the example, moving
  # together in one PR instead of one per directory.
  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      pub:
        patterns:
          - "*"
        group-by: dependency-name
