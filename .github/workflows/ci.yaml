name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Git state after pub get
        run: git status --porcelain

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Git state after analyze
        run: git status --porcelain

      - name: Run tests
        run: flutter test

      - name: Publish dry-run
        # `pub publish --dry-run` exits non-zero on *any* warning, including
        # "checked-in files are modified in git" — which says nothing about the
        # package and can trip on stat-only index staleness in a runner. Print
        # what git sees (this also refreshes the index) so a real modification
        # is visible in the log instead of hiding behind an opaque exit 65.
        run: |
          git --no-pager diff
          flutter pub publish --dry-run
