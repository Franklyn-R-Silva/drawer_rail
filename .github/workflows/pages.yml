# The example app, built for the web and served on GitHub Pages as the live
# demo the README links to. A PR only builds it, which catches an example the
# change broke; a push to main also deploys it.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the deploy job writes, and it asks for exactly that below.
permissions:
  contents: read

# A newer PR push supersedes a build in progress. On main nothing is cancelled:
# a deploy cut off halfway is worse than one that finishes and is replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      # Pages serves the site under /drawer_rail/, not the domain root; without
      # the base href every asset 404s.
      - name: Build the example for the web
        working-directory: example
        run: flutter build web --release --base-href /drawer_rail/

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: example/build/web

  deploy:
    name: deploy demo
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # prove to Pages the artifact came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
