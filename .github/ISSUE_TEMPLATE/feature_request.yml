name: ✨ Feature request
description: Suggest an idea or improvement for drawer_rail
title: "[Feature]: "
labels: ["enhancement"]
assignees: ["Franklyn-R-Silva"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to build that drawer_rail doesn't support? A problem without a solution is a fine request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. A theme field, a controller method, a new entry type? Say if you'd like to send the PR yourself.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Optional. How you would like the API to read.
      render: dart
